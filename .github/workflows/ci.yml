name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run manually
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
        default: all
        required: true
      run_tests:
        description: Run the test suite
        type: boolean
        default: true
        required: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.os
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream and print diff
        continue-on-error: true
        run: |
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/lmdb/lmdb.git
          git fetch upstream || true
          git diff --no-ext-diff upstream/HEAD...HEAD || \
            git diff --no-ext-diff || true

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build liblmdb
        run: cd libraries/liblmdb && make

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: cd libraries/liblmdb && make test
